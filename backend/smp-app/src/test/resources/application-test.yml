spring:
  datasource:
    url: jdbc:h2:mem:smp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
smp:
  label-studio:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: labelstudio
smp:
  label-studio:
    enabled: true
    base-url: http://127.0.0.1:${labelstudio.fake.port}
    token-secret-ref: env:LABEL_STUDIO_API_TOKEN
    token-value: f013-secret-token
    workspace-id: sandbox
    storage-policy: local-file-source
    export-format: JSON
    timeout-ms: 2000

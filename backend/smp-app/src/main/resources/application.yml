spring:
  application:
    name: smp-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:TODO_CONFIRM_POSTGRES_HOST}:${DB_PORT:5432}/${DB_NAME:TODO_CONFIRM_POSTGRES_DB}
    username: ${DB_USER:TODO_CONFIRM_POSTGRES_USER}
    password: ${DB_PASSWORD:TODO_CONFIRM_POSTGRES_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:600MB}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${SERVER_PORT:8080}
smp:
  content-safety:
    bypass: ${SMP_CONTENT_SAFETY_BYPASS:false}
  storage:
    endpoint: ${SMP_STORAGE_ENDPOINT:}
    public-endpoint: ${SMP_STORAGE_PUBLIC_ENDPOINT:}
    bucket: ${SMP_STORAGE_BUCKET:}
    access-key: ${SMP_STORAGE_ACCESS_KEY:}
    secret-key: ${SMP_STORAGE_SECRET_KEY:}
